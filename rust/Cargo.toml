[workspace]
exclude = ["./xtask"]

[profile.release]
lto = true # コンパイル時間が著しく長くなってしまう場合は無し

[package]
name = "rust"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
ac-library-rs = "=0.1.1"
num = "=0.4.1"
num-bigint = "=0.4.3"
num-integer = "=0.1.45"
num-rational = "=0.4.1"
regex = "=1.9.1"
itertools = "=0.11.0"
itertools-num = "=0.1.3"
maplit = "=1.0.2"
proconio = { version = "=0.4.5", features = ["derive"] }